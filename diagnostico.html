<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d14" />
  <title>Autodiagnóstico de automação — Whatchat</title>
  <meta name="description" content="Descubra em que estágio de automação sua empresa está. Responda 10 perguntas rápidas, veja seu resultado na hora e receba o relatório completo por e-mail." />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://whatchat.com.br/diagnostico.html" />
  <meta property="og:title" content="Autodiagnóstico de automação — Whatchat" />
  <meta property="og:description" content="Descubra em que estágio de automação sua empresa está. Responda 10 perguntas rápidas e receba o relatório completo por e-mail." />
  <meta property="og:image" content="https://whatchat.com.br/imagens/post1.png" />
  <meta property="og:locale" content="pt_BR" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="diagnostico.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="dxp">

  <a href="/" class="dx-logo">Whatchat</a>
  <div class="dx-progress" id="dxProgress" role="progressbar" aria-label="Progresso do autodiagnóstico" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div id="dxBar"></div>
  </div>

  <main class="dx-stage" id="dxStage" aria-live="polite">
    <noscript><p class="dx-lead">Ative o JavaScript para fazer o autodiagnóstico, ou fale comigo pelo <a href="https://wa.me/5521995132305">WhatsApp</a>.</p></noscript>
  </main>

  <footer class="dx-actions" id="dxActions">
    <button type="button" class="dx-back" id="dxBack" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar
    </button>
    <div class="dx-actions__right">
      <span class="dx-enter" id="dxEnter">pressione <kbd>Enter</kbd></span>
      <button type="button" class="dx-next" id="dxNext">
        <span id="dxNextLabel">Começar</span>
        <span class="dx-next__circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
      </button>
    </div>
  </footer>

  <!-- Campo isca contra robôs: pessoas não veem nem preenchem -->
  <div class="dx-hp" aria-hidden="true">
    <label for="dxWebsite">Site</label>
    <input type="text" id="dxWebsite" name="website" tabindex="-1" autocomplete="off" />
  </div>

  <script src="diagnostico.js"></script>
</body>
</html>
